name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever reads the repository. Without this block the workflow
# inherits whatever the repository default is, which can include write access.
permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_26.6.app

jobs:
  test:
    name: 🧪 Test & Build
    runs-on: macos-26

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s ${{ env.XCODE_PATH }}

      - name: 📦 Restore SPM cache
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 🔢 Check version consistency
        run: make version-check

      # Links, anchors and the CLAUDE.md file table — a document that drifts from the code
      # fails the build instead of misleading the next reader.
      - name: 📚 Check docs
        run: make docs-check

      # Every UI string is in the catalog and translated into Russian. `make app` runs it
      # too; here it fails in seconds instead of after the build.
      - name: 🌐 Check translations
        run: make l10n-check

      # Runs before the build so a formatting-only PR fails in seconds rather than after
      # a full compile.
      - name: 🎨 Check formatting
        run: make lint

      # `make coverage` runs the same suite as `swift test`, with instrumentation — one
      # step so the suite is not compiled and run twice. `shell: bash` is required, not
      # cosmetic: the default runner shell has no pipefail, so piping into tee would mask
      # a failing test run behind tee's exit code.
      - name: 🧪 Run tests with coverage
        shell: bash
        run: make coverage | tee coverage.txt

      - name: 📊 Coverage summary
        if: always()
        shell: bash
        run: |
          if [ ! -s coverage.txt ]; then
            echo "No coverage report produced — skipping summary."
            exit 0
          fi
          {
            echo '### 📊 Code coverage'
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
            echo ''
            echo '_The `SmartType` executable (main.swift) is not linked into the test bundle, so it does not appear here._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔨 Build release
        run: swift build -c release

      # Exercises what `swift build` never touches: the bundle layout and its signature.
      # Without this they would only ever run at release time.
      - name: 📦 Build .app bundle
        run: make app

      - name: 🔏 Verify bundle signature
        run: codesign --verify --strict --verbose=2 build/SmartType.app

      # Zipped: an artifact keeps no file modes (upload-artifact's README), and the binary
      # would lose its executable bit on the way to the launch check.
      - name: 📦 Zip the bundle for the launch check
        run: cd build && zip -qr SmartType.zip SmartType.app

      - name: ⬆️ Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: SmartType-app
          path: build/SmartType.zip
          retention-days: 1

  # SmartType promises macOS 14 (LSMinimumSystemVersion), is built with macOS 26's SDK, and is
  # developed on 27, so nothing else ever starts it on an older macOS. A framework or symbol
  # missing there stops it before its first line runs; still alive after 5 s, it got through
  # launch into its run loop. Drop 14 when GitHub retires that runner (deprecated in 2026).
  launch:
    name: 🚀 Launch on macOS ${{ matrix.macos }}
    needs: test
    runs-on: macos-${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: [14, 15]

    steps:
      - name: ⬇️ Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: SmartType-app

      - name: 🚀 Launch and stay up for 5 s
        run: |
          unzip -q SmartType.zip
          SmartType.app/Contents/MacOS/SmartType > launch.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "${pid}" 2>/dev/null; then
            status=0
            wait "${pid}" || status=$?
            cat launch.log
            echo "::error::SmartType exited with status ${status} within 5 s on macOS ${{ matrix.macos }}"
            exit 1
          fi
          kill "${pid}"
          echo "SmartType ran for 5 s on macOS $(sw_vers -productVersion)"
