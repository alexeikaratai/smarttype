version: 2

updates:
  # GitHub Actions only. The package declares no external SPM dependencies (Apple
  # frameworks are linked directly), so a `swift` entry would only produce empty runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One grouped PR per month rather than a separate PR per action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
